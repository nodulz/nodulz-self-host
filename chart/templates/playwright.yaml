{{- if .Values.playwright.enabled }}
{{- if not .Values.scripts.enabled }}
{{- fail "playwright.enabled requires scripts.enabled" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-playwright
spec:
  selector:
    matchLabels: {nodulz.dev/playwright-gateway: {{ .Release.Name }}}
  template:
    metadata:
      labels: {nodulz.dev/playwright-gateway: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          command: [bun, /app/deploy/playwright/gateway.mjs]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: proxy, containerPort: 3128}]
          readinessProbe:
            tcpSocket: {port: proxy}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          env:
            - {name: PLAYWRIGHT_ALLOWED_ORIGINS, value: {{ required "playwright.allowedOrigins is required" .Values.playwright.allowedOrigins | quote }}}
            - {name: PLAYWRIGHT_DENIED_CIDRS, value: {{ .Values.playwright.deniedCidrs | quote }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-playwright
spec:
  selector: {nodulz.dev/playwright-gateway: {{ .Release.Name }}}
  ports: [{name: proxy, port: 3128, targetPort: proxy}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-playwright
spec:
  podSelector:
    matchLabels: {nodulz.dev/playwright-gateway: {{ .Release.Name }}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 3128, protocol: TCP}]
      from:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: nodulz-playwright}
{{- end }}
