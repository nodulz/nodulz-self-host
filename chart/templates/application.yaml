{{- if not (has .Values.database.driver (list "sqlite" "postgres")) }}
{{- fail "database.driver must be sqlite or postgres" }}
{{- end }}
{{- if and (eq .Values.database.driver "postgres") (not .Values.existingSecret) }}
{{- fail "PostgreSQL requires existingSecret with connection and encryption secrets" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: {{ .Values.scripts.enabled }}
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nodulz
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 3001}]
          env:
            - {name: NODULZ_PUBLIC_URL, value: {{ .Values.publicUrl | quote }}}
            - {name: DATABASE_DRIVER, value: {{ .Values.database.driver | quote }}}
            {{- if .Values.scripts.enabled }}
            - {name: SCRIPT_RUNTIME, value: kubernetes}
            - {name: NODULZ_DATA_PVC, value: {{ .Values.persistence.existingClaim | default .Release.Name | quote }}}
            - name: KUBERNETES_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: KUBERNETES_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            {{- else }}
            - {name: SCRIPT_RUNTIME, value: docker}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.playwright.image }}
            - {name: PLAYWRIGHT_IMAGE, value: {{ . | quote }}}
            {{- end }}
            {{- if .Values.playwright.enabled }}
            - {name: PLAYWRIGHT_PROXY, value: {{ printf "http://%s-playwright:3128" .Release.Name | quote }}}
            - {name: PLAYWRIGHT_KUBE_SECCOMP, value: {{ required "playwright.seccompProfile is required" .Values.playwright.seccompProfile | quote }}}
            - {name: PLAYWRIGHT_GIT_ORIGINS, value: {{ .Values.playwright.gitOrigins | quote }}}
            {{- end }}
          {{- if .Values.existingSecret }}
          envFrom: [{secretRef: {name: {{ .Values.existingSecret }}}}]
          {{- end }}
          volumeMounts: [{name: data, mountPath: /app/data}]
          startupProbe:
            httpGet: {path: /api/ready, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /api/ready, port: http}
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            timeoutSeconds: 3
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: 3001, targetPort: http}]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
{{- if not .Values.persistence.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.persistence.size }}}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ .Release.Name }}, port: {number: 3001}}
{{- end }}
