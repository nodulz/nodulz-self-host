name: nodulz
services:
  nodulz:
    image: ghcr.io/nodulz/nodulz:${NODULZ_VERSION:?}
    restart: unless-stopped
    init: true
    ports:
      - "${NODULZ_PORT:-3001}:3001"
    env_file: .env
    environment:
      NODULZ_PUBLIC_URL: ${NODULZ_PUBLIC_URL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?}
      DATABASE_DRIVER: mysql
      DATABASE_URL: mysql://nodulz:${MYSQL_PASSWORD:?}@mysql:3306/nodulz
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - nodulz_data:/app/data
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 60s
  mysql:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nodulz
      MYSQL_USER: nodulz
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=tcp -h127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  nodulz_data:
  mysql_data:
