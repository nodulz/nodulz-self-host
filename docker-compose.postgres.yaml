name: nodulz
services:
  nodulz:
    image: ghcr.io/nodulz/nodulz:${NODULZ_VERSION:?}
    restart: unless-stopped
    init: true
    ports:
      - "${NODULZ_PORT:-3001}:3001"
    env_file: .env
    environment:
      NODULZ_PUBLIC_URL: ${NODULZ_PUBLIC_URL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?}
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgresql://nodulz:${POSTGRES_PASSWORD:?}@postgres:5432/nodulz
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - nodulz_data:/app/data
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 60s
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: nodulz
      POSTGRES_USER: nodulz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nodulz -d nodulz"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  nodulz_data:
  postgres_data:
